name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, format and tests
    runs-on: ubuntu-latest
    env:
      AUDIT_CHAIN_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/audit_chain_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: audit_chain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d audit_chain_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test

      - name: Autonomy evaluation
        run: npm run eval:autonomy

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

  requester-agent-e2e:
    runs-on: ubuntu-latest
    needs: check
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      USER_E2E_EMAIL: ${{ secrets.USER_E2E_EMAIL }}
      USER_E2E_PASSWORD: ${{ secrets.USER_E2E_PASSWORD }}
      E2E_ORG_ID: ${{ secrets.E2E_ORG_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: env.E2E_ORG_ID != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: env.E2E_ORG_ID != ''
        run: npm ci

      - name: Install Playwright Chromium
        if: env.E2E_ORG_ID != ''
        run: npx playwright install --with-deps chromium

      - name: Run requester-agent E2E tests
        if: env.E2E_ORG_ID != ''
        run: npx playwright test --project=requester-agent

      - name: Upload requester-agent Playwright report
        if: failure() && env.E2E_ORG_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: requester-agent-playwright-report
          path: playwright-report/
